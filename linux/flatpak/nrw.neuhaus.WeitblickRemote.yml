# The Flatpak of the Linux version. The GNOME runtime brings Python, PyGObject, GTK 4, libadwaita and libsecret;
# the manifest adds FreeRDP (the macOS app's version and channel set, see scripts/build-freerdp.sh), Tesseract for
# the agents' text recognition, and the app itself from this checkout.
#
#   flatpak-builder --user --install --force-clean build/flatpak linux/flatpak/nrw.neuhaus.WeitblickRemote.yml
#
# CI builds it in .github/workflows/linux.yml and attaches Weitblick-Remote-<arch>.flatpak to releases.
id: nrw.neuhaus.WeitblickRemote
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: weitblick-remote
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Sound and microphone.
  - --socket=pulseaudio
  # Printers in Windows.
  - --socket=cups
  # Shared folders, files on the clipboard and the Remmina import (also from Remmina's Flatpak).
  - --filesystem=home
  - --filesystem=~/.var/app/org.remmina.Remmina/data/remmina:ro
  # Passwords: the keyring through the secret portal, or the Secret Service where there is no portal.
  - --talk-name=org.freedesktop.secrets
  # Tesseract's CMake build has no compiled-in data folder.
  - --env=TESSDATA_PREFIX=/app/share/tessdata
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - "*.a"
modules:
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_TESTING=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_CLIENT_COMMON=ON
      - -DWITH_CLIENT=OFF
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_CLIENT_CHANNELS=ON
      - -DWITH_CHANNELS=ON
      - -DWITH_SERVER=OFF
      - -DWITH_SERVER_CHANNELS=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_PLATFORM_SERVER=OFF
      - -DWITH_WINPR_TOOLS=OFF
      - -DWITH_X11=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_DSP_FFMPEG=OFF
      - -DWITH_VIDEO_FFMPEG=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_CAIRO=OFF
      - -DWITH_OPENH264=OFF
      - -DWITH_JPEG=OFF
      - -DWITH_OPUS=OFF
      - -DWITH_SOXR=OFF
      - -DWITH_LAME=OFF
      - -DWITH_FAAD2=OFF
      - -DWITH_FAAC=OFF
      - -DWITH_GSM=OFF
      - -DWITH_AOM=OFF
      - -DWITH_DAV1D=OFF
      - -DWITH_YUV=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_SMARTCARD_EMULATE=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_CUPS=ON
      - -DWITH_PULSE=ON
      - -DWITH_ALSA=OFF
      - -DWITH_OSS=OFF
      - -DWITH_LIBSYSTEMD=OFF
      - -DWITH_KRB5=OFF
      - -DWITH_URIPARSER=OFF
      - -DWITH_JSON_DISABLED=ON
      - -DWITH_AAD=OFF
      - -DWITH_SIMD=ON
      # NTLM needs MD4 and RC4, which OpenSSL 3 only has in its legacy provider.
      - -DWITH_INTERNAL_RC4=ON
      - -DWITH_INTERNAL_MD4=ON
      # The channels the app uses, like the macOS app; the rest off.
      - -DCHANNEL_DRDYNVC=ON
      - -DCHANNEL_DRDYNVC_CLIENT=ON
      - -DCHANNEL_RDPGFX=ON
      - -DCHANNEL_RDPGFX_CLIENT=ON
      - -DCHANNEL_DISP=ON
      - -DCHANNEL_DISP_CLIENT=ON
      - -DCHANNEL_CLIPRDR=ON
      - -DCHANNEL_CLIPRDR_CLIENT=ON
      - -DCHANNEL_RDPSND=ON
      - -DCHANNEL_RDPSND_CLIENT=ON
      - -DCHANNEL_AUDIN=ON
      - -DCHANNEL_AUDIN_CLIENT=ON
      - -DCHANNEL_RDPDR=ON
      - -DCHANNEL_RDPDR_CLIENT=ON
      - -DCHANNEL_DRIVE=ON
      - -DCHANNEL_DRIVE_CLIENT=ON
      - -DCHANNEL_PRINTER=ON
      - -DCHANNEL_PRINTER_CLIENT=ON
      - -DCHANNEL_AINPUT=OFF
      - -DCHANNEL_ECHO=OFF
      - -DCHANNEL_ENCOMSP=OFF
      - -DCHANNEL_GEOMETRY=OFF
      - -DCHANNEL_GFXREDIR=OFF
      - -DCHANNEL_LOCATION=OFF
      - -DCHANNEL_PARALLEL=OFF
      - -DCHANNEL_RAIL=OFF
      - -DCHANNEL_RDP2TCP=OFF
      - -DCHANNEL_RDPEAR=OFF
      - -DCHANNEL_RDPECAM=OFF
      - -DCHANNEL_RDPEI=OFF
      - -DCHANNEL_RDPEMSC=OFF
      - -DCHANNEL_RDPEWA=OFF
      - -DCHANNEL_REMDESK=OFF
      - -DCHANNEL_SERIAL=OFF
      - -DCHANNEL_SMARTCARD=OFF
      - -DCHANNEL_SSHAGENT=OFF
      - -DCHANNEL_TELEMETRY=OFF
      - -DCHANNEL_TSMF=OFF
      - -DCHANNEL_URBDRC=OFF
      - -DCHANNEL_VIDEO=OFF
    post-install:
      # Fail loudly if a channel or backend the app relies on is missing.
      - |
        tables=$(find . -path '*/channels/client/tables.c' | head -n 1)
        for entry in '"drdynvc"' '"rdpgfx"' '"disp"' '"cliprdr"' '"rdpsnd"' '"audin"' '"rdpdr"' '"drive"' \
            '"printer"' pulse_freerdp_rdpsnd_client_subsystem_entry pulse_freerdp_audin_client_subsystem_entry \
            cups_freerdp_printer_client_subsystem_entry; do
          grep -q "$entry" "$tables" || { echo "missing from the FreeRDP build: $entry"; exit 1; }
        done
    sources:
      # The commit of the vendor/FreeRDP submodule the macOS app builds (test_repository.py checks it).
      - type: git
        url: https://github.com/FreeRDP/FreeRDP.git
        tag: 3.32.1
        commit: bf217a504e54cc719880c228e82353382cd7d4fa

  - name: leptonica
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROG=OFF
      - -DENABLE_GIF=OFF
      - -DENABLE_OPENJPEG=OFF
      - -DENABLE_TIFF=OFF
      - -DENABLE_WEBP=OFF
    sources:
      - type: archive
        url: https://github.com/DanBloomberg/leptonica/releases/download/1.87.0/leptonica-1.87.0.tar.gz
        sha256: c73363397f96eb1295602bf44d708a994ad42046c791bf03ea0505d829bdb6a7

  - name: tesseract
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_TRAINING_TOOLS=OFF
      - -DBUILD_TESTS=OFF
      - -DGRAPHICS_DISABLED=ON
      - -DDISABLE_ARCHIVE=ON
      - -DDISABLE_CURL=ON
      - -DOPENMP_BUILD=OFF
    sources:
      - type: archive
        url: https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz
        sha256: 9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884

  # English and German, like the Debian package's tesseract-ocr-eng and the suggested tesseract-ocr-deu.
  - name: tessdata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t ${FLATPAK_DEST}/share/tessdata eng.traineddata deu.traineddata
    sources:
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
        sha256: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
      - type: file
        url: https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/deu.traineddata
        sha256: 19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d

  - name: weitblick-remote
    buildsystem: simple
    build-commands:
      - make -C linux
      # The unit tests, against this runtime's Python, PyGObject, GTK and libadwaita. GdkPixbuf's image
      # loaders (glycin) can't open their own sandbox inside the build.
      - GLYCIN_DISABLE_SANDBOX=i-know-the-risks make -C linux test
      - make -C linux install PREFIX=${FLATPAK_DEST}
      # /app is read-only at run time.
      - python3 -m compileall -q ${FLATPAK_DEST}/lib/weitblick-remote
    sources:
      # This checkout: the C bridge (Sources/WeitblickBridge), the icon (design/icon), the shared test fixture
      # and linux/.
      - type: dir
        path: ../..
        skip:
          - .git
          - linux/build
          - linux/.flatpak-builder
          - site
          - vendor
