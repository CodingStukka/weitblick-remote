name: WeitblickRemote
options:
  bundleIdPrefix: nrw.neuhaus
  # English is the source language; German comes from the string catalogs (Localizable.xcstrings,
  # InfoPlist.xcstrings, the ConnectionStore package's catalog).
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# Signing lives in the xcconfig (ad-hoc by default, optional gitignored Local.xcconfig on top), so
# no signing setting may appear below: project and target settings would override it.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Emits the localizable strings of each Swift target (.stringsdata) for `xcstringstool sync`.
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  KeyboardEngine:
    path: Packages/KeyboardEngine
  ConnectionStore:
    path: Packages/ConnectionStore
  AgentControl:
    path: Packages/AgentControl

settingGroups:
  freerdpLink:
    LIBRARY_SEARCH_PATHS: $(SRCROOT)/vendor/install/lib
    OTHER_LDFLAGS:
      - -lfreerdp-client3
      - -lfreerdp3
      - -lwinpr3
      - -lssl
      - -lcrypto
      - -lcups # printer redirection (system CUPS)
      - -framework AudioToolbox
      - -framework AVFoundation
      - -framework Carbon
      - -framework CoreAudio
      - -framework CoreServices
      - -framework IOKit
      - -framework Security

targets:
  WeitblickBridge:
    type: library.static
    platform: macOS
    sources:
      - Sources/WeitblickBridge
    settings:
      base:
        SYSTEM_HEADER_SEARCH_PATHS:
          - $(SRCROOT)/vendor/install/include/freerdp3
          - $(SRCROOT)/vendor/install/include/winpr3
        USER_HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/WeitblickBridge/include
        GCC_C_LANGUAGE_STANDARD: gnu17
        GCC_WARN_UNUSED_PARAMETER: NO
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        SKIP_INSTALL: YES

  WeitblickKit:
    type: library.static
    platform: macOS
    sources:
      - Sources/WeitblickKit
    dependencies:
      - target: WeitblickBridge
    settings:
      base:
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO

  WeitblickRemote:
    type: application
    platform: macOS
    sources:
      - Sources/WeitblickRemote
      # Shown in the About panel (AboutPanel.swift).
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: WeitblickKit
      - target: WeitblickBridge
      - package: KeyboardEngine
        product: KeyboardEngine
      - package: ConnectionStore
        product: ConnectionStore
      - package: AgentControl
        product: AgentControl
      # The MCP stdio helper, next to the app binary in Contents/MacOS.
      - target: weitblick-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    scheme:
      testTargets: [WeitblickRemoteTests]
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_NAME: Weitblick Remote
        PRODUCT_MODULE_NAME: WeitblickRemote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Document type for .rdp files; the generated Info.plist keys are merged into it.
        INFOPLIST_FILE: Sources/WeitblickRemote/Support/Info.plist
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Passes the microphone on to the remote Windows PC when the connection allows it."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to Windows PCs on your local network."
        CODE_SIGN_ENTITLEMENTS: Sources/WeitblickRemote/Support/WeitblickRemote.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.weitblick-remote
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Weitblick Remote
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Marc Neuhaus"

  # MCP stdio server for agents: relays to the app's socket, launches the app hidden
  # (Sources/WeitblickMCP/main.swift). Embedded in the app.
  weitblick-mcp:
    type: tool
    platform: macOS
    sources:
      - Sources/WeitblickMCP
    settings:
      base:
        PRODUCT_NAME: weitblick-mcp
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.weitblick-remote.mcp
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        SKIP_INSTALL: YES

  weitblick-smoke:
    type: tool
    platform: macOS
    sources:
      - Sources/WeitblickSmoke
    dependencies:
      - target: WeitblickKit
      - target: WeitblickBridge
    scheme: {}
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.weitblick-remote.smoke

  # Keyboard and clipboard end-to-end test against the VM (scripts/e2e.sh).
  weitblick-e2e:
    type: tool
    platform: macOS
    sources:
      - Sources/WeitblickE2E
      - Sources/WeitblickSmoke/SmokeProbe.swift
      - Sources/WeitblickSmoke/FramebufferSnapshot.swift
      - Sources/WeitblickRemote/Input/RemoteKeyboard+Actions.swift
    dependencies:
      - target: WeitblickKit
      - target: WeitblickBridge
      - package: KeyboardEngine
        product: KeyboardEngine
    scheme: {}
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.weitblick-remote.e2e

  # Pure logic of the app, compiled in directly so the tests need no app host.
  WeitblickRemoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/WeitblickRemoteTests
      - Sources/WeitblickRemote/Session/DesktopGeometry.swift
      - Sources/WeitblickRemote/Session/ScrollAccumulator.swift
      - Sources/WeitblickRemote/Session/RemoteCursors.swift
      - Sources/WeitblickRemote/Input/SystemShortcutTap.swift
      - Sources/WeitblickRemote/Model
    dependencies:
      - target: WeitblickKit
      - target: WeitblickBridge
      - package: KeyboardEngine
        product: KeyboardEngine
      - package: ConnectionStore
        product: ConnectionStore
    settings:
      groups: [freerdpLink]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nrw.neuhaus.weitblick-remote.tests
        GENERATE_INFOPLIST_FILE: YES
